name: Build Fresh Alarm Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q AlarmTest_Fresh_Native_SingleShot.zip -d extracted

      - name: Build APK
        working-directory: extracted
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlarmTest-debug
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
